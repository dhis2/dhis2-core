# Variant of dhis.conf for manually testing the tracker file and image endpoint timeout.
# Used with docker-compose.s3-chaos.yml, see README.md.

connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://db/dhis
connection.username = dhis
connection.password = dhis

system.update_notifications_enabled = off

# Low so a toxic on the object store trips it in seconds rather than minutes.
tracker.export.timeout = 5

# Object store reached only through toxiproxy, so its latency can be controlled at will.
filestore.provider = s3
filestore.container = dhis2
filestore.location = eu-west-1
filestore.endpoint = http://proxy:18081
filestore.identity = dhis
filestore.secret = dhisdhis

# Debugging: prepend SQL comments with request context for query attribution.
# This can influence performance as unique comments prevent prepared statement caching.
#monitoring.sql.context = on
#monitoring.sql.context.keys = controller,method,requestId,sessionId
#logging.query = on
