
services:
  web:
    image: "${DHIS2_IMAGE:-dhis2/core-dev:local}"
    # Only container ports are specified, as the E2E tests run in parallel in Jenkins and using explicit host ports causes collision
    ports:
      - "8080" # DHIS2
      - "8081" # Debugger: connect using commandline flag -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8081
    volumes:
      - ./config/dhis2_home/dhis.conf:/opt/dhis2/dhis.conf:ro
    environment:
      # JAVA_TOOL_OPTIONS: Standard JVM environment variable, works with all image types
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      s3:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.5-alpine
    command: postgres -c max_locks_per_transaction=100 -c shared_preload_libraries=postgis-3
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhis
      POSTGRES_DB: dhis
      POSTGRES_PASSWORD: &postgres_password dhis
      PGPASSWORD: *postgres_password # needed by psql in healthcheck
      LC_COLLATE: C
    healthcheck:
      test: [ "CMD-SHELL", "psql --no-password --quiet --username $$POSTGRES_USER postgres://127.0.0.1/$$POSTGRES_DB -p 5432 --command \"SELECT 'ok'\" > /dev/null" ]
      start_period: 120s
      interval: 1s
      timeout: 3s
      retries: 5

  redis:
    image: redis:5.0.5-alpine
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis.conf
    ports:
      - "6379"

  s3:
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false
    ports:
      - "8333" # S3 API
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8333/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      # SeaweedFS registers these as the admin S3 identity
      AWS_ACCESS_KEY_ID: root
      AWS_SECRET_ACCESS_KEY: dhisdhis

  selenium:
    image: "${SELENIUM_IMAGE:-selenium/standalone-chrome:latest}"
    ports:
      - "4444"
      - "7900"

# Fixed subnet so the test container can have a deterministic IP: the impersonation
# feature's IP allowlist (switch_user_allow_listed_ips) is an exact string match.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
