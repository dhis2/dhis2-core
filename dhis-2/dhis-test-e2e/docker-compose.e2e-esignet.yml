# Based on mosip/esignet v2.0.0 docker-compose (db528423dac7898ad546cb7b2f5f867a949676a7).
# Isolated, disposable test network; never point this at production databases.
# @author Morten Svanæs <msvanaes@dhis2.org>
services:
  # DHIS2 needs PostGIS; eSignet uses its own upstream PostgreSQL schema below.
  db:
    image: postgis/postgis:16-3.5-alpine
    environment:
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
      POSTGRES_DB: dhis
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dhis -d dhis']
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: ${DHIS2_IMAGE:-dhis2/core-dev:esignet-e2e}
    ports: ['127.0.0.1::8080']
    volumes:
      - ./config/esignet/dhis.conf:/opt/dhis2/dhis.conf:ro
      - ${ESIGNET_RUN_DIR:-./target/esignet}/runtime/client.p12:/opt/dhis2/client.p12:ro
    environment:
      JAVA_TOOL_OPTIONS: -Xmx2g
    depends_on:
      db:
        condition: service_healthy
  # Upstream schema and mock identity seed, fetched from the pinned release by the runner.
  database:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ${ESIGNET_RUN_DIR:-./target/esignet}/runtime/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 30
  # Real upstream mock national-ID backend: sends/validates OTP and supplies consented claims.
  mock-identity-system:
    image: mosipid/mock-identity-system:0.14.0
    user: root
    environment:
      container_user: mosip
      active_profile_env: default,local
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/mosip_mockidentitysystem?currentSchema=mockidentitysystem
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MOSIP_ESIGNET_HOST: esignet:8080
      # The upstream local profile hardcodes localhost:8088/v1/esignet; align with this issuer.
      MOSIP_MOCKIDENTITYSYSTEM_ESIGNET_ISSUER_ID: http://esignet:8080
      JAVA_TOOL_OPTIONS: -Xmx768m
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8082/v1/mock-identity-system/actuator/health]
      interval: 5s
      timeout: 5s
      retries: 60
  # Released eSignet plus the explicit external-RSA JWKS metadata fix in config/esignet/.
  # No token/userinfo stubs; in-memory cache avoids an unnecessary Redis service.
  esignet:
    build:
      context: ./config/esignet
    image: dhis2/esignet-e2e:2.0.0-jwks-fix
    user: root
    ports: ['127.0.0.1::8080']
    environment:
      container_user: mosip
      PORT: '8080'
      DATABASE_HOST: database
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      KEYMANAGER_KEYSTORE_TYPE: PKCS12
      KEYMANAGER_DB_SCHEMA: esignet
      KEYMANAGER_PKCS12_FILE_PATH: /opt/mosip/test.pfx
      KEYMANAGER_PKCS12_PASSWORD: localtest
      KEYMANAGER_PKCS12_ALLOW_INSECURE_SOFTWARE_KEYSTORE: 'true'
      MOSIP_ESIGNET_CACHE_TYPE: inmemory
      MOSIP_ESIGNET_HOST: http://esignet:8080
      MOSIP_ESIGNET_OIDC_UI_SCHEME: http
      MOSIP_ESIGNET_OIDC_UI_HOSTNAME: esignet-ui
      MOSIP_ESIGNET_OIDC_UI_PORT: '3000'
      MOSIP_ESIGNET_CAPTCHA_SITE_PROVIDER: hcaptcha
      MOSIP_ESIGNET_CAPTCHA_SITE_KEY: 10000000-ffff-ffff-ffff-000000000001
      MOSIP_ESIGNET_AUTHN_PROVIDER: mock
      MOSIP_ESIGNET_MOCK_DOMAIN_URL: http://mock-identity-system:8082
    depends_on:
      database:
        condition: service_healthy
      mock-identity-system:
        condition: service_healthy
  # Upstream login frontend and API proxy; the suite drives its documented flow API headlessly.
  esignet-ui:
    image: mosipid/oidc-ui:2.0.0
    user: root
    ports: ['127.0.0.1::3000']
    environment:
      container_user: mosip
      DEFAULT_LANG: en
    volumes:
      - ${ESIGNET_RUN_DIR:-./target/esignet}/runtime/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [esignet]
  test:
    build: .
    command: ['mvn', 'test', '-Pesignet', '--batch-mode', '--no-transfer-progress', '-Dinstance.url=http://web:8080/api', '-Dtest.cleanup=false', '-Drp.enable=false']
    volumes:
      - ${ESIGNET_RUN_DIR:-./target/esignet}/reports:/target/surefire-reports
      - ${ESIGNET_RUN_DIR:-./target/esignet}/runtime/client.p12:/client.p12:ro
      - test-maven:/root/.m2
    depends_on: [web, esignet-ui]

volumes:
  test-maven:
