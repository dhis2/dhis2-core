# Disposable eSignet E2E configuration. Never use these credentials in production.
# @author Morten Svanæs <msvanaes@dhis2.org>
connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://db/dhis
connection.username = dhis
connection.password = dhis
audit.logger = off
server.base.url = http://web:8080
oidc.oauth2.login.enabled = on
oidc.provider.esignet.client_id = dhis2-e2e
oidc.provider.esignet.client_authentication_method = private_key_jwt
oidc.provider.esignet.client_assertion_audience = http://esignet:8080
oidc.provider.esignet.mapping_claim = email
oidc.provider.esignet.display_alias = eSignet E2E
oidc.provider.esignet.scopes = email
oidc.provider.esignet.authorization_uri = http://esignet:8080/oauth2/authorize
oidc.provider.esignet.token_uri = http://esignet:8080/oauth2/token
oidc.provider.esignet.user_info_uri = http://esignet:8080/oauth2/userinfo
oidc.provider.esignet.jwk_uri = http://esignet:8080/oauth2/jwks
oidc.provider.esignet.issuer_uri = http://esignet:8080
oidc.provider.esignet.id_token_jws_algorithm = PS256
oidc.provider.esignet.user_info_response_type = jwt
oidc.provider.esignet.user_info_jws_algorithm = RS256
oidc.provider.esignet.keystore_path = /opt/dhis2/client.p12
oidc.provider.esignet.keystore_password = e2e-password
oidc.provider.esignet.key_alias = esignet
oidc.provider.esignet.key_password = e2e-password
oidc.provider.esignet.jwk_set_url = http://web:8080/api/publicKeys/esignet/jwks.json
