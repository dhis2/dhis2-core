filestore.provider = transient
filestore.container = files
encryption.password=54C73D06-1D34-477F-94B0-8F94E59BE41D

# Run Postgres integration tests with the second level cache enabled and the query cache
# disabled. This matches the effective behavior CI has always run with: the previous
# use_second_level_cache=false here was silently ignored (the cache was auto-enabled by
# Hibernate), and the query cache setting was never passed on when the flag was false.
hibernate.cache.use_query_cache=false
hibernate.cache.use_second_level_cache=true
# Blank on purpose: use default JCache caches instead of ehcache.xml, again matching the
# effective behavior CI has always run with. The 'classpath:ehcache.xml' default value is
# exercised separately by HibernateEhcacheConfigFileTest; flipping this default for all
# integration tests (bounded ehcache.xml regions) is a deliberate decision for later.
cache.ehcache.config.file=

enable.api_token.authentication = on

audit.in_memory-queue.enabled=off;
metadata.audit.persist=on
tracker.audit.persist=on
aggregate.audit.persist=on
audit.metadata=CREATE;UPDATE;DELETE
audit.tracker=CREATE;UPDATE;DELETE
audit.aggregate=CREATE;UPDATE;DELETE

db.pool.type=hikari
connection.pool.timeout=5000
connection.pool.max_size=80
connection.pool.min_idle=3
connection.pool.max_idle_time=25
connection.pool.max_lifetime_seconds=30
connection.pool.warn_max_age=28000

use.local.dhis.conf=no