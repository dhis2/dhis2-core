filestore.provider = transient
filestore.container = files
encryption.password=54C73D06-1D34-477F-94B0-8F94E59BE41D

# Run Postgres integration tests with both caches explicitly off. This matches the effective
# behavior CI has always run with on this branch: hibernate-ehcache registers two RegionFactory
# strategies, so Hibernate never auto-selects one and the second level cache stayed off, and the
# query cache setting was never passed on when the second level cache flag was false.
hibernate.cache.use_query_cache=false
hibernate.cache.use_second_level_cache=false

enable.api_token.authentication = on

audit.in_memory-queue.enabled=off;
metadata.audit.persist=on
tracker.audit.persist=on
aggregate.audit.persist=on
audit.metadata=CREATE;UPDATE;DELETE
audit.tracker=CREATE;UPDATE;DELETE
audit.aggregate=CREATE;UPDATE;DELETE

flyway.skip_migration=false

db.pool.type=hikari
connection.pool.timeout=5000
connection.pool.max_size=80
connection.pool.min_idle=3
connection.pool.max_idle_time=25
connection.pool.max_lifetime_seconds=30
connection.pool.warn_max_age=28000
