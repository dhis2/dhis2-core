---
name: tracked_entity_attribute_null_plain_and_encrypted_value
description: Tracked entity attribute value with neither a plain text nor an encrypted value
section: Programs
section_order: 8
summary_sql: >-
  WITH rs as (
  SELECT teav.trackedentityid, teav.trackedentityattributeid
  FROM trackedentityattributevalue teav
  WHERE teav.value IS NULL
  AND teav.encryptedvalue IS NULL
  )
  SELECT COUNT(*) as value,
  100.0 * COUNT(*) / NULLIF( (SELECT COUNT(*) from trackedentityattributevalue),0) as percent
  from rs;
details_sql: >-
  SELECT
    te.uid as uid,
    te.uid || ' / ' || tea.name as name,
    'Attribute "' || tea.name || '" (' || tea.uid || ') has no value' AS comment
  FROM trackedentityattributevalue teav
  INNER JOIN trackedentity te ON te.trackedentityid = teav.trackedentityid
  INNER JOIN trackedentityattribute tea ON tea.trackedentityattributeid = teav.trackedentityattributeid
  WHERE teav.value IS NULL
  AND teav.encryptedvalue IS NULL;
severity: CRITICAL
introduction: >
  A tracked entity attribute value row is meaningful only because of its value. A row with neither a
  plain text `value` nor an `encryptedvalue` carries no information and is not a state the application
  produces: clearing an attribute value deletes the row instead of storing NULL.

  Such rows are removed automatically by a database migration when upgrading to this version, so this
  check is expected to always pass. It exists as a safety net to detect rows created afterwards, for
  example by direct database manipulation. In version 2.44 and later the `value` column is not nullable,
  so the upgrade will remove any such rows.
details_id_type: tracker
recommendation: >-
  These rows carry no information and can be safely deleted:

  DELETE FROM trackedentityattributevalue
  WHERE value IS NULL
  AND encryptedvalue IS NULL;

  As is always the case with direct database manipulation, you should ensure that you have a backup of your
  database before running these commands, ensure that DHIS2 is not running, and perform the change in a test
  environment first.

  After applying the fix, restart DHIS2 and re-run the integrity check to ensure that no tracked entity
  attribute values are flagged.
is_slow: true
