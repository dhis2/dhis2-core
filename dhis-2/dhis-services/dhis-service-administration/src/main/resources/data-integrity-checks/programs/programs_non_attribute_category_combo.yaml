---
name: programs_non_attribute_category_combo
description: Programs whose category combination is not an attribute category combination
section: Programs
section_order: 4
summary_sql: >-
  WITH programs_non_attribute_cc AS (
  SELECT pr.uid, pr.name, cc.name AS comment
  FROM program pr
  JOIN categorycombo cc ON cc.categorycomboid = pr.categorycomboid
  WHERE cc.name <> 'default'
  AND COALESCE(cc.datadimensiontype, '') <> 'ATTRIBUTE')
  SELECT COUNT(*) AS value,
  100.0 * COUNT(*) / NULLIF( (SELECT COUNT(*) FROM program), 0) AS percent
  FROM programs_non_attribute_cc;
details_sql: >-
  SELECT pr.uid, pr.name, cc.name AS comment
  FROM program pr
  JOIN categorycombo cc ON cc.categorycomboid = pr.categorycomboid
  WHERE cc.name <> 'default'
  AND COALESCE(cc.datadimensiontype, '') <> 'ATTRIBUTE'
  ORDER BY pr.name;
severity: SEVERE
introduction: >
  The category combination of a program defines the attribute option combinations its events
  and enrollments are stored with. It must either be the default category combination or a
  category combination with the data dimension type "Attribute". A program using a category
  combination of type "Disaggregation" stores its events and enrollments with disaggregation
  category option combinations as attribute option combinations, which is not a valid
  configuration. Such events and enrollments are not returned to users who are not superusers
  in tracker exports. The name of the category combination is shown as the comment.
details_id_type: programs
recommendation: >
  Assign the program a category combination of type "Attribute" (or the default category
  combination). Events and enrollments already stored with the invalid attribute option
  combinations need to be moved to valid attribute option combinations, which can be done by a
  superuser who can still export them.
