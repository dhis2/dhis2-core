---
name: job_configurations_housekeeping_not_running
description: The Housekeeping job is disabled, missing or has stopped completing
section: Job scheduler
section_order: 1
summary_sql: >-
  SELECT COUNT(*) AS value
  FROM (
  SELECT 1 FROM jobconfiguration
  WHERE jobtype = 'HOUSEKEEPING'
  AND (enabled = false
  OR jobstatus = 'DISABLED'
  OR COALESCE(lastfinished, created) < now() - interval '1 hour')
  UNION ALL
  SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM jobconfiguration WHERE jobtype = 'HOUSEKEEPING')
  ) AS problems;
details_sql: >-
  SELECT uid, name,
  CASE
  WHEN enabled = false THEN 'Disabled'
  WHEN jobstatus = 'DISABLED' THEN 'Enabled, but stored as DISABLED so it is never started'
  ELSE 'Enabled, but has not completed a run in the last hour'
  END || ', last completed ' || COALESCE(to_char(lastfinished, 'YYYY-MM-DD HH24:MI'), 'never') AS comment
  FROM jobconfiguration
  WHERE jobtype = 'HOUSEKEEPING'
  AND (enabled = false
  OR jobstatus = 'DISABLED'
  OR COALESCE(lastfinished, created) < now() - interval '1 hour')
  UNION ALL
  SELECT 'DHIS2rocks1', 'Housekeeping', 'Missing: no Housekeeping job exists'
  WHERE NOT EXISTS (SELECT 1 FROM jobconfiguration WHERE jobtype = 'HOUSEKEEPING');
details_id_type: jobConfigurations
severity: CRITICAL
introduction: >
  The Housekeeping job runs every 20 seconds and keeps the job scheduler healthy. It deletes
  finished one-off jobs such as asynchronous imports, resets jobs left marked as running after a
  crash or restart, marks disabled jobs as DISABLED, and recreates missing default jobs. If it is
  disabled, missing or no longer completing, none of this happens: the job list keeps growing
  (instances have reached 100,000 rows, which makes the Scheduler app slow), and a job left marked
  as running blocks every later job of the same type, for example all analytics runs.
recommendation: >
  If the Housekeeping job is disabled, it was most likely switched off directly in the database,
  because the Scheduler app does not allow changing system jobs. Older versions emptied the Hibernate
  second-level cache on every Housekeeping run (DHIS2-21963, fixed in 2.41.10, 2.42.6 and 2.43.2), which
  is a common reason for switching it off. On a fixed version, take a backup and re-enable it with
  UPDATE jobconfiguration SET enabled = true, jobstatus = 'SCHEDULED' WHERE uid = 'DHIS2rocks1';
  If it has been off for a long time, the first run deletes every finished one-off job in one go;
  you can review their number first in the Scheduler app or in the "Job scheduler" checks.
  If the job is enabled but not completing, check the server log for errors from the Housekeeping job.
  If it is missing, restart the server or contact your system administrator.
