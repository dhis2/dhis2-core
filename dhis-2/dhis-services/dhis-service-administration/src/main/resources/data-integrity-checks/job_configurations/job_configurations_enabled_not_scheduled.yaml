---
name: job_configurations_enabled_not_scheduled
description: Enabled recurring jobs that the scheduler will never start
section: Job scheduler
section_order: 2
summary_sql: >-
  SELECT COUNT(*) as value,
  100.0 * COUNT(*) / NULLIF((SELECT COUNT(*) FROM jobconfiguration WHERE schedulingtype <> 'ONCE_ASAP'), 0) as percent
  FROM jobconfiguration
  WHERE enabled = true
  AND jobstatus = 'DISABLED'
  AND schedulingtype <> 'ONCE_ASAP';
details_sql: >
  SELECT uid,
  name,
  concat(jobtype, ', last run ', COALESCE(to_char(lastexecuted, 'YYYY-MM-DD HH24:MI'), 'never')) as comment
  FROM jobconfiguration
  WHERE enabled = true
  AND jobstatus = 'DISABLED'
  AND schedulingtype <> 'ONCE_ASAP'
  ORDER BY name;
details_id_type: jobConfigurations
severity: SEVERE
introduction: >
  The scheduler only starts jobs whose stored status is SCHEDULED. These recurring jobs are enabled, but their
  stored status is still DISABLED, so they are never started. The Scheduler app and the API report them
  as scheduled, which hides the problem. This happens when a job is re-enabled after the Housekeeping job
  has already marked it DISABLED.
recommendation: >
  For each job listed, use "Run now" in the Scheduler app (or POST /api/jobConfigurations/{uid}/execute).
  This moves the job back to SCHEDULED, and after the run it continues on its normal schedule.
  Check afterwards that the job no longer appears in this list.
