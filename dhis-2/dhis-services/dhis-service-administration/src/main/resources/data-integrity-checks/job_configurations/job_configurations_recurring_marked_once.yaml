---
name: job_configurations_recurring_marked_once
description: Recurring jobs with a schedule that are marked as one-off jobs
section: Job scheduler
section_order: 5
summary_sql: >-
  SELECT COUNT(*) as value,
  100.0 * COUNT(*) / NULLIF((SELECT COUNT(*) FROM jobconfiguration
  WHERE cronexpression IS NOT NULL OR delay IS NOT NULL), 0) as percent
  FROM jobconfiguration
  WHERE schedulingtype = 'ONCE_ASAP'
  AND (cronexpression IS NOT NULL OR delay IS NOT NULL)
  AND jobstatus NOT IN ('SCHEDULED', 'RUNNING');
details_sql: >
  SELECT uid,
  name,
  concat(jobtype, ', ', COALESCE('cron ' || cronexpression, 'delay ' || delay || 's'),
  CASE WHEN enabled THEN ', enabled' ELSE ', disabled' END) as comment
  FROM jobconfiguration
  WHERE schedulingtype = 'ONCE_ASAP'
  AND (cronexpression IS NOT NULL OR delay IS NOT NULL)
  AND jobstatus NOT IN ('SCHEDULED', 'RUNNING')
  ORDER BY name;
details_id_type: jobConfigurations
severity: INFO
introduction: >
  These jobs have a cron expression or a fixed delay, but are marked with the one-off scheduling type.
  Upgrading from 2.40 or earlier marks every existing job as one-off; a recurring job corrects itself after
  its first run, but a job that was disabled at the time of the upgrade keeps the wrong type. Such a job
  shows unexpected details in the Scheduler app, and is not started on its schedule after it is enabled
  again until it has run once.
recommendation: >
  If the job is no longer needed, delete it in the Scheduler app.
  To keep it, enable it and then use "Run now" once in the Scheduler app
  (or POST /api/jobConfigurations/{uid}/execute). When that run finishes, the job is marked as recurring
  again and continues on its schedule.
