---
name: job_configurations_stuck_running
description: Jobs that are still marked as running long after their last sign of progress
section: Job scheduler
section_order: 3
summary_sql: >-
  WITH timeouts AS (
  SELECT
  COALESCE((SELECT CASE WHEN btrim(value, '"') ~ '^[0-9]+$' THEN CAST(btrim(value, '"') AS integer) END
  FROM systemsetting WHERE name = 'jobsRescheduleAfterMinutes'), 10) AS minutes
  )
  SELECT COUNT(*) as value
  FROM jobconfiguration j, timeouts t
  WHERE j.jobstatus = 'RUNNING'
  AND COALESCE(j.lastalive, j.lastexecuted, j.created) < now() - make_interval(mins => t.minutes);
details_sql: >
  WITH timeouts AS (
  SELECT
  COALESCE((SELECT CASE WHEN btrim(value, '"') ~ '^[0-9]+$' THEN CAST(btrim(value, '"') AS integer) END
  FROM systemsetting WHERE name = 'jobsRescheduleAfterMinutes'), 10) AS minutes
  )
  SELECT j.uid,
  j.name,
  concat(j.jobtype, ', started ', COALESCE(to_char(j.lastexecuted, 'YYYY-MM-DD HH24:MI'), 'unknown'),
  ', last alive ', COALESCE(to_char(j.lastalive, 'YYYY-MM-DD HH24:MI'), 'never')) as comment
  FROM jobconfiguration j, timeouts t
  WHERE j.jobstatus = 'RUNNING'
  AND COALESCE(j.lastalive, j.lastexecuted, j.created) < now() - make_interval(mins => t.minutes)
  ORDER BY j.lastexecuted;
details_id_type: jobConfigurations
severity: CRITICAL
introduction: >
  A running job regularly records that it is alive. These jobs are still marked as running, but have not
  shown any sign of progress for longer than the stale-job timeout (system setting jobsRescheduleAfterMinutes,
  which applies to all job types). Usually the server was restarted or the job
  crashed while it was running. While a job of a type is marked as running, no other job of the same type
  is started, so for example a single stuck analytics run blocks all later analytics runs.
  The Housekeeping job normally resets such jobs; if they are listed here, Housekeeping is disabled or failing.
recommendation: >
  Check that the Housekeeping job is enabled and completing in the Scheduler app.
  Reset each job listed with POST /api/jobConfigurations/{uid}/revert. Recurring jobs then continue on
  their schedule.
