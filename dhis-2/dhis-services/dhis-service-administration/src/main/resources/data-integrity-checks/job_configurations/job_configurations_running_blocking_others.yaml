---
name: job_configurations_running_blocking_others
description: Running jobs that other jobs of the same type have been waiting behind for more than 10 minutes
section: Job scheduler
section_order: 7
summary_sql: >-
  SELECT COUNT(*) as value
  FROM jobconfiguration r
  WHERE r.jobstatus = 'RUNNING'
  AND COALESCE(r.lastexecuted, r.created) < now() - interval '10 minutes'
  AND EXISTS (
  SELECT 1 FROM jobconfiguration w
  WHERE w.jobtype = r.jobtype
  AND w.jobconfigurationid <> r.jobconfigurationid
  AND w.enabled = true
  AND w.jobstatus = 'SCHEDULED'
  AND w.queueposition IS NULL
  AND ((w.schedulingtype = 'ONCE_ASAP' AND w.cronexpression IS NULL AND w.delay IS NULL
  AND w.created < now() - interval '10 minutes')
  OR (w.schedulingtype = 'ONCE_ASAP' AND (w.cronexpression IS NOT NULL OR w.delay IS NOT NULL))
  OR (w.schedulingtype = 'FIXED_DELAY' AND w.delay IS NOT NULL
  AND COALESCE(w.lastexecuted, w.created) + w.delay * interval '1 second' < now() - interval '10 minutes')));
details_sql: >
  SELECT r.uid,
  r.name,
  concat(r.jobtype, ', started ', COALESCE(to_char(r.lastexecuted, 'YYYY-MM-DD HH24:MI'), 'unknown'),
  ', last alive ', COALESCE(to_char(r.lastalive, 'YYYY-MM-DD HH24:MI'), 'never'),
  ', jobs waiting: ', w.waiting) as comment
  FROM jobconfiguration r
  JOIN LATERAL (
  SELECT COUNT(*) AS waiting FROM jobconfiguration w
  WHERE w.jobtype = r.jobtype
  AND w.jobconfigurationid <> r.jobconfigurationid
  AND w.enabled = true
  AND w.jobstatus = 'SCHEDULED'
  AND w.queueposition IS NULL
  AND ((w.schedulingtype = 'ONCE_ASAP' AND w.cronexpression IS NULL AND w.delay IS NULL
  AND w.created < now() - interval '10 minutes')
  OR (w.schedulingtype = 'ONCE_ASAP' AND (w.cronexpression IS NOT NULL OR w.delay IS NOT NULL))
  OR (w.schedulingtype = 'FIXED_DELAY' AND w.delay IS NOT NULL
  AND COALESCE(w.lastexecuted, w.created) + w.delay * interval '1 second' < now() - interval '10 minutes'))
  ) w ON w.waiting > 0
  WHERE r.jobstatus = 'RUNNING'
  AND COALESCE(r.lastexecuted, r.created) < now() - interval '10 minutes'
  ORDER BY r.lastexecuted;
details_id_type: jobConfigurations
severity: WARNING
introduction: >
  Only one job of each type runs at a time. While a job is marked as running, every other job of the same
  type that is due, for example an analytics run started from the Data Administration app or with
  "Run now", waits until it has finished. These running jobs have been holding up other jobs of their type
  for more than 10 minutes. If the running job is still working, this is expected, but each extra run that is
  started only joins the line. If the server was restarted while the job was running, the job is no longer
  running at all, but stays marked as running until the stale-job timeout passes (4 hours for analytics
  jobs by default), and all jobs of that type wait until then without any error being shown.
recommendation: >
  Compare the last alive time of each job listed with the time of the last server restart. If the job was
  last alive before the restart, or a long time ago, it is no longer running: reset it with
  POST /api/jobConfigurations/{uid}/revert, and the waiting jobs start on the next scheduler loop.
  If it is still alive, let it finish, and do not start the same job again in the meantime: each waiting
  run is carried out in turn once the running job has finished.
