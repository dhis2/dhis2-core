---
name: job_configurations_never_started
description: One-off jobs that were created more than a day ago but never started
section: Job scheduler
section_order: 4
summary_sql: >-
  SELECT COUNT(*) as value
  FROM jobconfiguration
  WHERE schedulingtype = 'ONCE_ASAP'
  AND cronexpression IS NULL
  AND delay IS NULL
  AND queuename IS NULL
  AND lastexecuted IS NULL
  AND lastfinished IS NULL
  AND jobstatus <> 'RUNNING'
  AND created < now() - interval '1 day';
details_sql: >
  SELECT uid,
  name,
  concat(jobtype, ', ', jobstatus, ', created ', to_char(created, 'YYYY-MM-DD HH24:MI')) as comment
  FROM jobconfiguration
  WHERE schedulingtype = 'ONCE_ASAP'
  AND cronexpression IS NULL
  AND delay IS NULL
  AND queuename IS NULL
  AND lastexecuted IS NULL
  AND lastfinished IS NULL
  AND jobstatus <> 'RUNNING'
  AND created < now() - interval '1 day'
  ORDER BY created;
details_id_type: jobConfigurations
severity: WARNING
introduction: >
  One-off jobs, such as asynchronous imports, normally start within seconds of being created and are
  deleted automatically by the Housekeeping job once they have finished. These jobs were created more
  than a day ago but never started, so their work was never done. The Housekeeping job only removes
  jobs that have finished, so these jobs, and any uploaded data attached to them, stay in the system
  indefinitely.
recommendation: >
  For asynchronous imports, the data in the job was not imported. Check with the users concerned whether
  the data has been sent again since. The import payload is kept as a file resource with the same UID as
  the job until the job is deleted.
  Import jobs are system jobs and cannot be deleted through the Scheduler app or the API. Once they are
  no longer needed, delete them in the database, after taking a backup, with
  DELETE FROM jobconfiguration WHERE uid IN (...) using the UIDs listed.
  The attached file resources are released by the next Housekeeping run that deletes a finished job,
  and are then removed by the file resource clean-up job.
