---
name: datasets_non_attribute_category_combo
description: Data sets whose category combination is not an attribute category combination
section: Data sets
section_order: 5
summary_sql: >-
  WITH datasets_non_attribute_cc AS (
  SELECT ds.uid, ds.name, cc.name AS comment
  FROM dataset ds
  JOIN categorycombo cc ON cc.categorycomboid = ds.categorycomboid
  WHERE cc.name <> 'default'
  AND COALESCE(cc.datadimensiontype, '') <> 'ATTRIBUTE')
  SELECT COUNT(*) AS value,
  100.0 * COUNT(*) / NULLIF( (SELECT COUNT(*) FROM dataset), 0) AS percent
  FROM datasets_non_attribute_cc;
details_sql: >-
  SELECT ds.uid, ds.name, cc.name AS comment
  FROM dataset ds
  JOIN categorycombo cc ON cc.categorycomboid = ds.categorycomboid
  WHERE cc.name <> 'default'
  AND COALESCE(cc.datadimensiontype, '') <> 'ATTRIBUTE'
  ORDER BY ds.name;
severity: SEVERE
introduction: >
  The category combination of a data set defines the attribute option combinations its data
  is entered and stored with. It must either be the default category combination or a category
  combination with the data dimension type "Attribute". A data set using a category combination
  of type "Disaggregation" stores its data with disaggregation category option combinations
  as attribute option combinations, which is not a valid configuration. Such data is not
  returned to users who are not superusers in data value exports, and requesting it with an
  explicit attribute option combination fails with error E2049. The name of the category
  combination is shown as the comment.
details_id_type: dataSets
recommendation: >
  Assign the data set a category combination of type "Attribute" (or the default category
  combination). Data already stored with the invalid attribute option combinations needs to be
  moved to valid attribute option combinations, which can be done by a superuser who can still
  export this data.
