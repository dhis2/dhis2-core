---
name: users_capture_ou_not_in_tei_search_ou
description: Users which have a data capture organisation unit which is not within their tracked entity search organisation unit hierarchy
section: Users
section_order: 2
summary_sql: >-
  WITH flagged AS (
  SELECT um.userinfoid, ou.name
  FROM usermembership um
  JOIN organisationunit ou ON ou.organisationunitid = um.organisationunitid
  WHERE EXISTS (SELECT 1 FROM userteisearchorgunits h WHERE h.userinfoid = um.userinfoid)
  AND NOT EXISTS (
  SELECT 1
  FROM userteisearchorgunits h
  JOIN organisationunit hou ON hou.organisationunitid = h.organisationunitid
  WHERE h.userinfoid = um.userinfoid
  AND hou.uid = ANY(ou.patharray)
  )
  )
  SELECT COUNT(DISTINCT userinfoid) as count,
  100.0 * COUNT(DISTINCT userinfoid) / NULLIF((SELECT COUNT(*) FROM userinfo), 0) as percent
  FROM flagged;
details_sql: >-
  WITH flagged AS (
  SELECT um.userinfoid, ou.name
  FROM usermembership um
  JOIN organisationunit ou ON ou.organisationunitid = um.organisationunitid
  WHERE EXISTS (SELECT 1 FROM userteisearchorgunits h WHERE h.userinfoid = um.userinfoid)
  AND NOT EXISTS (
  SELECT 1
  FROM userteisearchorgunits h
  JOIN organisationunit hou ON hou.organisationunitid = h.organisationunitid
  WHERE h.userinfoid = um.userinfoid
  AND hou.uid = ANY(ou.patharray)
  )
  )
  SELECT ui.uid,
  ui.username as name,
  NULL as comment,
  array_agg(f.name ORDER BY f.name) as refs
  FROM flagged f
  JOIN userinfo ui ON ui.userinfoid = f.userinfoid
  GROUP BY ui.uid, ui.username;
details_id_type: users
severity: WARNING
introduction: >
  Users who can enter tracker data should also be able to search for tracked entities. If a users 
  data capture organisation unit is not within their tracked entity search organisation unit hierarchy,
  they may not be able to search for all tracked entities that they have entered data for.
recommendation: >
  Users should be able to search for all tracked entities that they have entered data for. Using the results
  of the details query, adjust either the users capture organisation unit so that it is within the tracked entity
    search organisation unit hierarchy. Alternatively, you can consider to adjust the tracked entity search organisation
    unit hierarchy so that it includes the data capture organisation unit.