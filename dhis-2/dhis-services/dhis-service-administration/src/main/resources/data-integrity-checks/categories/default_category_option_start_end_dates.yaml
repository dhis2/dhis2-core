---
name: category_options_default_has_start_or_end_date
description: The default category option should not have a start or end date
section: Categories
section_order: 22
summary_sql: >-
  WITH default_co_with_dates AS (
    SELECT uid, name
    FROM categoryoption
    WHERE name = 'default'
    AND (startdate IS NOT NULL OR enddate IS NOT NULL)
  )
  SELECT COUNT(*) AS value,
  100.0 * COUNT(*) / NULLIF((SELECT COUNT(*) FROM categoryoption), 0) AS percent
  FROM default_co_with_dates;
details_sql: >-
  SELECT uid, name,
  'Start date: ' || COALESCE(TO_CHAR(startdate, 'YYYY-MM-DD'), 'none') ||
  ', end date: ' || COALESCE(TO_CHAR(enddate, 'YYYY-MM-DD'), 'none') AS comment
  FROM categoryoption
  WHERE name = 'default'
  AND (startdate IS NOT NULL OR enddate IS NOT NULL);
details_id_type: categoryOptions
severity: SEVERE
introduction: >
  The default category option is used as a special category option throughout the system,
  and is part of the default category option combination which is used whenever data has
  no other disaggregation or attribute. It should not have a start or end date. The start and
  end dates of a category option restrict the periods for which data can be entered using that
  option. If the default category option has a start or end date, aggregate data values
  submitted with the default attribute option combination are rejected for every period
  outside of that date range.
recommendation: |
  Remove the start and end dates from the default category option. If this is not possible
  through the API, the dates can be removed directly in the database. As is always the case
  when modifying the database directly, make sure to back up your database before running
  the query.
  ```sql
  UPDATE categoryoption
  SET startdate = NULL, enddate = NULL
  WHERE name = 'default';
  ```
