---
name: category_options_default_has_organisation_units
description: The default category option should not be assigned to any organisation units
section: Categories
section_order: 21
summary_sql: >-
  WITH default_co_with_ous AS (
    SELECT DISTINCT co.uid, co.name
    FROM categoryoption co
    JOIN categoryoption_organisationunits coou ON coou.categoryoptionid = co.categoryoptionid
    WHERE co.name = 'default'
  )
  SELECT COUNT(*) AS value,
  100.0 * COUNT(*) / NULLIF((SELECT COUNT(*) FROM categoryoption), 0) AS percent
  FROM default_co_with_ous;
details_sql: >-
  SELECT co.uid, co.name,
  'Assigned to ' || COUNT(coou.organisationunitid) || ' organisation unit(s)' AS comment
  FROM categoryoption co
  JOIN categoryoption_organisationunits coou ON coou.categoryoptionid = co.categoryoptionid
  WHERE co.name = 'default'
  GROUP BY co.uid, co.name;
details_id_type: categoryOptions
severity: SEVERE
introduction: >
  The default category option is used as a special category option throughout the system,
  and is part of the default category option combination which is used whenever data has
  no other disaggregation or attribute. It should not be assigned to any organisation units.
  Assigning organisation units to a category option restricts the data which can be entered
  using that option to those organisation units and their descendants. If the default category
  option is assigned to organisation units, aggregate data values submitted with the default
  attribute option combination are rejected for every organisation unit outside of that
  hierarchy.
recommendation: |
  Remove all organisation unit assignments from the default category option. If this is not
  possible through the API, the assignments can be removed directly in the database. As is
  always the case when modifying the database directly, make sure to back up your database
  before running the query.
  ```sql
  DELETE FROM categoryoption_organisationunits
  WHERE categoryoptionid IN (SELECT categoryoptionid FROM categoryoption WHERE name = 'default');
  ```
