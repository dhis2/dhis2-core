---
name: enrollments_not_deleted_of_deleted_tracked_entities
description: Enrollments that are not deleted but belong to a deleted tracked entity
section: Tracker data
section_order: 1
summary_sql: >-
    SELECT COUNT(*) AS value,
    COALESCE(100.0 * COUNT(*) / NULLIF((SELECT COUNT(*) FROM enrollment WHERE deleted = false), 0), 0) AS percent
    FROM enrollment en
    INNER JOIN trackedentity te ON te.trackedentityid = en.trackedentityid
    WHERE en.deleted = false
    AND te.deleted = true;
details_sql: >-
    SELECT p.uid, p.name,
    COUNT(*) || ' enrollment(s)' AS comment,
    array_agg(CAST(en.uid AS text) ORDER BY en.uid) AS refs
    FROM enrollment en
    INNER JOIN trackedentity te ON te.trackedentityid = en.trackedentityid
    INNER JOIN program p ON p.programid = en.programid
    WHERE en.deleted = false
    AND te.deleted = true
    GROUP BY p.uid, p.name
    ORDER BY p.name;
details_id_type: programs
severity: SEVERE
introduction: >
    When a tracked entity is deleted, all its enrollments must be deleted as well.
    Bugs in earlier versions allowed enrollments to be created or updated for a tracked entity that
    was already deleted, leaving enrollments that are not deleted under a deleted tracked entity.
    These enrollments cannot be opened in the apps and can only be deleted through the tracker API,
    but can still show up in working lists and counts.
    The details list the affected programs, how many enrollments each has in this state, and the
    enrollments as references.
recommendation: |
    Delete the listed enrollments so that they match their deleted tracked entity. Delete them
    through the tracker API, which allows deleting an enrollment of a deleted tracked entity and
    also deletes the events, relationships, notifications and change logs of the enrollment.
    Deleting enrollments that have events requires the authority to cascade delete enrollments.

    ```
    POST /api/tracker?importStrategy=DELETE&async=false

    {
      "enrollments": [
        { "enrollment": "<enrollment UID>" }
      ]
    }
    ```
is_slow: TRUE
