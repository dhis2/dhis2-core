name: Run eSignet tests

# AI Assisted
# @author Morten Svanæs <msvanaes@dhis2.org>
# Deliberately no push or schedule trigger. Mirrors the analytics opt-in label gate.
on:
  pull_request:
    types: [opened, labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  esignet-test:
    if: contains(github.event.pull_request.labels.*.name, 'run-esignet-tests') || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Build this checkout and run real eSignet E2E
        run: ./dhis-2/dhis-test-e2e/run-esignet-tests.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esignet-e2e
          path: |
            dhis-2/dhis-test-e2e/target/esignet/run.*/*.log
            dhis-2/dhis-test-e2e/target/esignet/run.*/reports/
          retention-days: 7
